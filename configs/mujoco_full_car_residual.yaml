inherits: mujoco_full_car_history.yaml

residual_control:
  enabled: true
  prior: full_car_mpc_lite
  scale: 0.5
  gate:
    enabled: true
    min_scale: 0.0
    max_scale: 0.5
    safety_deadband: 0.1
    safety_power: 1.0
    delay_weight: 0.05
    noise_weight: 80.0
    bias_weight: 50.0
    dropout_weight: 1.0
    scale_error_weight: 1.0
  shield:
    enabled: true
    max_residual_fraction: 0.6
    hard_margin: 0.05
    soft_margin: 0.18

policy_safety:
  enabled: true
  max_action_fraction: 0.75
  max_delta_fraction: 0.08
  hard_margin: 0.04
  soft_margin: 0.2

imitation:
  enabled: false
  dataset: datasets/expert/full_car_mpc_lite.npz
  epochs: 20
  batch_size: 256
  max_steps_per_epoch: null
  residual_targets: true
  eval_pretrained: true
  anchor_enabled: true
  anchor_initial_weight: 0.25
  anchor_final_weight: 0.02
  anchor_decay_episodes: 40
  anchor_batch_size: 256
  anchor_max_samples: 4096

reward:
  deviation: 0.05

evaluation:
  controllers: ["PASSIVE", "FULL_CAR_MPC_LITE"]
