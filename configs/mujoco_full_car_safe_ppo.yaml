inherits: mujoco_full_car_residual.yaml

imitation:
  enabled: true
  dataset: datasets/expert/full_car_mpc_lite.npz
  epochs: 20
  batch_size: 256
  max_steps_per_epoch: null
  residual_targets: true
  eval_pretrained: true
  anchor_enabled: true
  anchor_initial_weight: 0.25
  anchor_final_weight: 0.02
  anchor_decay_episodes: 40
  anchor_batch_size: 256
  anchor_max_samples: 4096

policy_action_parameterization:
  enabled: true
  mode: delta
  max_delta_fraction: 0.05
  max_action_fraction: 0.75
  safety_margin_scale: true
  min_margin_scale: 0.25
  safety_margin_power: 1.0

policy_improvement_gate:
  enabled: true
  teacher: passive
  min_scale: 0.0
  max_scale: 1.0
  preview_rms_threshold: 0.10
  preview_rms_softness: 0.08
  accel_threshold: 1.2
  accel_softness: 2.0
  pitch_acc_scale: 0.2
  roll_acc_scale: 0.2
  safety_margin_scale: true
  hard_margin: 0.04
  soft_margin: 0.2

rl:
  episodes: 200
  eval_every: 10
  save_every: 25
  ppo:
    lam: 0.95
    clip_ratio: 0.12
    train_epochs: 6
    minibatch_size: 256
    entropy_coef: 0.0005
    value_coef: 0.5
    projection_penalty_weight: 0.2
    unsafe_penalty_weight: 1.0
    action_delta_penalty_weight: 0.4
    adaptive_constraint_weights: true
    constraint_weight_lr: 0.5
    projection_error_target: 0.18
    unsafe_fraction_target: 0.0
    action_delta_target: 0.02
    max_constraint_weight: 3.0
    feasibility_advantage_weight: 0.0
    feasibility_advantage_min: 0.2
