inherits: mujoco_full_car_residual.yaml

imitation:
  enabled: true
  dataset: datasets/expert/full_car_mpc_lite.npz
  epochs: 20
  batch_size: 256
  max_steps_per_epoch: null
  residual_targets: true
  eval_pretrained: true
  anchor_enabled: true
  anchor_initial_weight: 0.25
  anchor_final_weight: 0.02
  anchor_decay_episodes: 40
  anchor_batch_size: 256
  anchor_max_samples: 4096

rl:
  episodes: 200
  eval_every: 10
  save_every: 25
  ppo:
    lam: 0.95
    clip_ratio: 0.12
    train_epochs: 6
    minibatch_size: 256
    entropy_coef: 0.0005
    value_coef: 0.5
    projection_penalty_weight: 0.2
    unsafe_penalty_weight: 1.0
    action_delta_penalty_weight: 0.4
